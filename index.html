<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Alvaro's Library</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins para um visual mais arredondado e amigável -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        library: {
                            light: '#fdfbf7', // Cor de página de livro
                            primary: '#8b5cf6', // Roxo suave (fantasia/imaginação)
                            secondary: '#f472b6', // Rosa suave
                            accent: '#fcd34d', // Amarelo (iluminação/luz)
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-20px) rotate(5deg)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(40px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Estilos adicionais para animações suaves */
        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #fae8ff 100%);
            min-height: 100vh;
        }

        .input-field {
            transition: all 0.3s ease;
        }

        .input-field:focus-within {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.15), 0 8px 10px -6px rgba(139, 92, 246, 0.1);
        }

        .floating-icon {
            position: absolute;
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
        }

        /* Efeito de brilho no botão */
        .btn-hover-effect {
            position: relative;
            overflow: hidden;
        }
        
        .btn-hover-effect::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(45deg) scale(0);
            transition: transform 0.6s ease;
        }

        .btn-hover-effect:hover::after {
            transform: rotate(45deg) scale(1);
        }

        /* Ocultar barra de rolagem mas permitir rolagem se necessário */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative overflow-x-hidden text-gray-800">

    <!-- Decorações de Fundo (Ícones flutuantes) -->
    <div class="floating-icon text-purple-300 text-6xl top-10 left-10 animate-float"><i class="fas fa-book-open"></i></div>
    <div class="floating-icon text-pink-300 text-5xl bottom-20 left-20 animate-float-delayed" style="animation-duration: 8s;"><i class="fas fa-bookmark"></i></div>
    <div class="floating-icon text-blue-300 text-7xl top-20 right-10 animate-float-delayed"><i class="fas fa-book"></i></div>
    <div class="floating-icon text-yellow-300 text-4xl bottom-32 right-24 animate-float" style="animation-duration: 7s;"><i class="fas fa-star"></i></div>

    <!-- Container Principal do Card -->
    <div class="bg-white/90 backdrop-blur-xl w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden relative z-10 opacity-0 animate-fade-in-up border border-white/50">
        
        <!-- Faixa decorativa no topo -->
        <div class="h-3 w-full bg-gradient-to-r from-blue-400 via-library-primary to-library-secondary"></div>

        <div class="p-8 sm:p-10">
            <!-- Cabeçalho -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-purple-100 text-library-primary mb-4 shadow-inner">
                    <i class="fas fa-book-reader text-3xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Alvaro's Library</h1>
                <p class="text-gray-500 mt-2 text-sm">Abra a porta para novas aventuras literárias.</p>
            </div>

            <!-- Mensagem de Sucesso (Oculta por padrão) -->
            <div id="successMessage" class="hidden text-center py-10 opacity-0 transition-opacity duration-500">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-green-100 text-green-500 mb-4 animate-bounce">
                    <i class="fas fa-check text-4xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Bem-vindo(a)!</h2>
                <p class="text-gray-500 mt-2">Sua conta foi criada com sucesso na biblioteca.</p>
                <button onclick="resetForm()" class="mt-6 text-library-primary font-medium hover:underline">Voltar</button>
            </div>

            <!-- Formulário de Cadastro -->
            <form id="registerForm" class="space-y-5" onsubmit="handleRegister(event)">
                
                <!-- Campo: Nome -->
                <div class="input-field relative">
                    <label for="nome" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1 ml-1">Nome Completo</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400"></i>
                        </div>
                        <input type="text" id="nome" name="nome" required placeholder="Ex: Alvaro Silva" 
                            class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 text-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-library-primary/50 focus:border-library-primary focus:bg-white transition-colors">
                    </div>
                </div>

                <!-- Campo: E-mail -->
                <div class="input-field relative">
                    <label for="email" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1 ml-1">E-mail</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                        <input type="email" id="email" name="email" required placeholder="seu@email.com" 
                            class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 text-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-library-primary/50 focus:border-library-primary focus:bg-white transition-colors">
                    </div>
                </div>

                <!-- Campo: Senha -->
                <div class="input-field relative">
                    <label for="senha" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1 ml-1">Senha</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="senha" name="senha" required placeholder="Mínimo 8 caracteres" 
                            class="w-full pl-11 pr-12 py-3 bg-gray-50 border border-gray-200 text-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-library-primary/50 focus:border-library-primary focus:bg-white transition-colors">
                        <!-- Botão mostrar senha -->
                        <button type="button" onclick="togglePassword('senha', 'eye-icon-1')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-library-primary transition-colors focus:outline-none">
                            <i id="eye-icon-1" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Campo: Confirmar Senha -->
                <div class="input-field relative">
                    <label for="confirmaSenha" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1 ml-1">Confirmar Senha</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-shield-alt text-gray-400"></i>
                        </div>
                        <input type="password" id="confirmaSenha" name="confirmaSenha" required placeholder="Repita sua senha" 
                            class="w-full pl-11 pr-12 py-3 bg-gray-50 border border-gray-200 text-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-library-primary/50 focus:border-library-primary focus:bg-white transition-colors">
                        <!-- Botão mostrar senha -->
                        <button type="button" onclick="togglePassword('confirmaSenha', 'eye-icon-2')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-library-primary transition-colors focus:outline-none">
                            <i id="eye-icon-2" class="fas fa-eye"></i>
                        </button>
                    </div>
                    <p id="passwordError" class="text-red-500 text-xs mt-1 hidden ml-2">As senhas não coincidem.</p>
                </div>

                <!-- Botão de Cadastro -->
                <button type="submit" class="w-full btn-hover-effect bg-gradient-to-r from-library-primary to-library-secondary text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-purple-500/30 hover:shadow-purple-500/50 transform hover:-translate-y-1 transition-all duration-300 mt-4">
                    Criar Minha Conta <i class="fas fa-arrow-right ml-2"></i>
                </button>
                
            </form>

            <!-- Rodapé / Login -->
            <div id="formFooter" class="mt-8 text-center">
                <p class="text-sm text-gray-600">
                    Já é um leitor? 
                    <a href="#" class="font-semibold text-library-primary hover:text-library-secondary transition-colors hover:underline">
                        Entrar na conta
                    </a>
                </p>
            </div>

        </div>
    </div>

    <!-- Scripts para interatividade -->
    <script>
        // Função para mostrar/esconder senha
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Função para lidar com o envio do formulário
        function handleRegister(event) {
            event.preventDefault(); // Evita recarregar a página
            
            const senha = document.getElementById('senha').value;
            const confirmaSenha = document.getElementById('confirmaSenha').value;
            const errorText = document.getElementById('passwordError');

            // Validação simples de senha
            if (senha !== confirmaSenha) {
                errorText.classList.remove('hidden');
                document.getElementById('confirmaSenha').classList.add('border-red-400', 'focus:border-red-500', 'focus:ring-red-400/50');
                
                // Remove o foco do erro após 3 segundos
                setTimeout(() => {
                    errorText.classList.add('hidden');
                    document.getElementById('confirmaSenha').classList.remove('border-red-400', 'focus:border-red-500', 'focus:ring-red-400/50');
                }, 3000);
                return;
            }

            // Animação de sucesso
            const form = document.getElementById('registerForm');
            const footer = document.getElementById('formFooter');
            const successMsg = document.getElementById('successMessage');

            // Fade out formulário
            form.style.opacity = '0';
            footer.style.opacity = '0';
            
            setTimeout(() => {
                form.classList.add('hidden');
                footer.classList.add('hidden');
                
                // Mostrar mensagem de sucesso
                successMsg.classList.remove('hidden');
                // Pequeno delay para o fade in funcionar
                setTimeout(() => {
                    successMsg.classList.remove('opacity-0');
                    successMsg.classList.add('opacity-100');
                }, 50);
            }, 300); // Tempo do fade out
        }

        // Função para resetar o formulário (apenas para demonstração)
        function resetForm() {
            const form = document.getElementById('registerForm');
            const footer = document.getElementById('formFooter');
            const successMsg = document.getElementById('successMessage');

            form.reset();
            
            successMsg.classList.remove('opacity-100');
            successMsg.classList.add('opacity-0');

            setTimeout(() => {
                successMsg.classList.add('hidden');
                
                form.classList.remove('hidden');
                footer.classList.remove('hidden');
                
                setTimeout(() => {
                    form.style.opacity = '1';
                    footer.style.opacity = '1';
                }, 50);
            }, 500);
        }
    </script>
</body>
</html>
